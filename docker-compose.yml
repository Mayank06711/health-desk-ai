services:
  postgres:
    image: postgres:16-alpine
    container_name: health-desk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-voice_agent}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    container_name: health-desk-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      RUNNING_IN_DOCKER: "true"
    command: ["python", "run_api.py"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  agent:
    build: ./backend
    container_name: health-desk-agent
    env_file:
      - ./backend/.env
    environment:
      RUNNING_IN_DOCKER: "true"
    command: ["python", "main.py", "start"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: health-desk-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
